<!doctype html>
<html lang="ko" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>포켓몬 스플렌더</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              game: ['DungGeunMo', 'Galmuri', 'monospace'],
            },
            animation: {
              'glow-pulse': 'glow-pulse 1.5s ease-in-out infinite',
            },
            keyframes: {
              'glow-pulse': {
                '0%, 100%': { boxShadow: '0 0 5px rgba(34,197,94,0.4), 0 0 10px rgba(34,197,94,0.2)' },
                '50%': { boxShadow: '0 0 15px rgba(34,197,94,0.8), 0 0 30px rgba(34,197,94,0.4)' },
              },
            },
          },
        },
      }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=DungGeunMo&display=swap" rel="stylesheet" />
  </head>
  <body class="h-screen overflow-hidden font-game">
    <div id="app" class="h-screen w-screen"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
